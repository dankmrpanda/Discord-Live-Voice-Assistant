services:
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # Use host networking during build so apt/pip DNS follows host resolver.
      # This avoids resolver issues seen on some Alpine VM Docker setups.
      network: host
    image: discord-live-vc-bot:latest
    container_name: discord-live-vc-bot
    restart: unless-stopped
    # Match host user IDs so bind-mounted files (for example ./logs) are writable.
    user: "${UID:-1000}:${GID:-1000}"

    # IMPORTANT: host networking avoids Docker bridge/NAT iptables paths.
    # This is the recommended mode on Alpine hosts where nftables/iptables
    # interaction can break Discord voice connectivity.
    network_mode: host

    env_file:
      - ../.env
    environment:
      # Ensure all runtime debug/audio dumps also land in the mounted logs dir.
      LOG_DIR: /app/logs
      # Store OpenWakeWord downloaded model assets in writable, persisted storage.
      OWW_MODEL_DIR: /app/openwakeword_models

    volumes:
      # Default workflow: run source code directly from host so src edits
      # do not require image rebuilds.
      - ../src:/app/src
      - ../config.yaml:/app/config.yaml:ro
      - ../logs:/app/logs
      - ../openwakeword_models:/app/openwakeword_models

    command: ["python", "-m", "src.main"]
